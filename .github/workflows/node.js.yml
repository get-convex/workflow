name: Run tests
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
      - run: |
          npm i
          cd example && npm i && cd ..
          npm run typecheck
          cd example && npm run lint && cd ..
          npm test
      - run: npm i
      - run: cd example && npm i && cd ..
      - run: npm run typecheck
      - run: cd example && npm run lint && cd ..
      - run: npm test
